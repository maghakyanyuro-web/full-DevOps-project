name: Full DevOps Auto Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to AWS Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/full-DevOps-project
            git pull origin main
            docker build -t full-devops-project:latest ./app
            docker stop full-devops-project || true
            docker rm full-devops-project || true
            docker run -dp 3000:3000 --name full-devops-project full-devops-project:latest

